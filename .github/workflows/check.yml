name: Stock check

on:
  schedule:
    - cron: "*/5 * * * *"    # wakes up every 5 minutes; check.py only really checks every 10-25 min (random)
  workflow_dispatch:          # lets you start it by hand from the Actions tab (always checks)

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # next_check.txt lives in the Actions cache instead of the repo,
      # so the random timer doesn't create a commit on every check
      - name: Restore timer
        uses: actions/cache/restore@v4
        with:
          path: next_check.txt
          key: timer-${{ github.run_id }}
          restore-keys: timer-

      - name: Check product page
        id: check
        run: python3 check.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save timer
        if: steps.check.outputs.checked == 'true'
        uses: actions/cache/save@v4
        with:
          path: next_check.txt
          key: timer-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock state"
            git push
          fi
